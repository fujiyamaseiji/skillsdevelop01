<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>商品一覧 | ECサイト</title>
    <!-- 外部CSSファイルを読み込む -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- ヘッダー -->
    <header class="header">
        <h1 class="header__title">ECサイト</h1>

        <!-- カートアイコン・合計個数 -->
        <div class="header__cart" id="js-cart-icon">
            <!-- カートアイコン（SVG） -->
            <svg class="header__cart-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="9" cy="21" r="1"></circle>
                <circle cx="20" cy="21" r="1"></circle>
                <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
            </svg>
            <!-- 合計個数バッジ（初期値: 0） -->
            <span class="header__cart-badge" id="js-cart-badge">0</span>
        </div>
    </header>

    <!-- メインコンテンツ -->
    <main class="main">

        <!-- 商品一覧セクション -->
        <section class="product-list">
            <h2 class="product-list__heading">商品一覧</h2>

            <!-- 商品グリッド（6点） -->
            <div class="product-list__grid">

                <!-- 商品カード 1 -->
                <article class="product-card">
                    <div class="product-card__image-wrap">
                        <img
                            class="product-card__image"
                            src="https://placehold.jp/400x300.png?text=Product+01"
                            alt="オーガニックコットン Tシャツ"
                        >
                    </div>
                    <div class="product-card__body">
                        <p class="product-card__name">オーガニックコットン Tシャツ</p>
                        <p class="product-card__price">
                            ¥3,980
                            <span class="product-card__price-note">（税込）</span>
                        </p>
                        <button class="product-card__button" type="button">カートに入れる</button>
                    </div>
                </article>

                <!-- 商品カード 2 -->
                <article class="product-card">
                    <div class="product-card__image-wrap">
                        <img
                            class="product-card__image"
                            src="https://placehold.jp/400x300.png?text=Product+02"
                            alt="リネン ワイドパンツ"
                        >
                    </div>
                    <div class="product-card__body">
                        <p class="product-card__name">リネン ワイドパンツ</p>
                        <p class="product-card__price">
                            ¥7,480
                            <span class="product-card__price-note">（税込）</span>
                        </p>
                        <button class="product-card__button" type="button">カートに入れる</button>
                    </div>
                </article>

                <!-- 商品カード 3 -->
                <article class="product-card">
                    <div class="product-card__image-wrap">
                        <img
                            class="product-card__image"
                            src="https://placehold.jp/400x300.png?text=Product+03"
                            alt="レザー トートバッグ"
                        >
                    </div>
                    <div class="product-card__body">
                        <p class="product-card__name">レザー トートバッグ</p>
                        <p class="product-card__price">
                            ¥12,800
                            <span class="product-card__price-note">（税込）</span>
                        </p>
                        <button class="product-card__button" type="button">カートに入れる</button>
                    </div>
                </article>

                <!-- 商品カード 4 -->
                <article class="product-card">
                    <div class="product-card__image-wrap">
                        <img
                            class="product-card__image"
                            src="https://placehold.jp/400x300.png?text=Product+04"
                            alt="ウール ニットセーター"
                        >
                    </div>
                    <div class="product-card__body">
                        <p class="product-card__name">ウール ニットセーター</p>
                        <p class="product-card__price">
                            ¥9,680
                            <span class="product-card__price-note">（税込）</span>
                        </p>
                        <button class="product-card__button" type="button">カートに入れる</button>
                    </div>
                </article>

                <!-- 商品カード 5 -->
                <article class="product-card">
                    <div class="product-card__image-wrap">
                        <img
                            class="product-card__image"
                            src="https://placehold.jp/400x300.png?text=Product+05"
                            alt="キャンバス スニーカー"
                        >
                    </div>
                    <div class="product-card__body">
                        <p class="product-card__name">キャンバス スニーカー</p>
                        <p class="product-card__price">
                            ¥6,200
                            <span class="product-card__price-note">（税込）</span>
                        </p>
                        <button class="product-card__button" type="button">カートに入れる</button>
                    </div>
                </article>

                <!-- 商品カード 6 -->
                <article class="product-card">
                    <div class="product-card__image-wrap">
                        <img
                            class="product-card__image"
                            src="https://placehold.jp/400x300.png?text=Product+06"
                            alt="シルク スカーフ"
                        >
                    </div>
                    <div class="product-card__body">
                        <p class="product-card__name">シルク スカーフ</p>
                        <p class="product-card__price">
                            ¥4,500
                            <span class="product-card__price-note">（税込）</span>
                        </p>
                        <button class="product-card__button" type="button">カートに入れる</button>
                    </div>
                </article>

            </div>
            <!-- /商品グリッド -->
        </section>
        <!-- /商品一覧セクション -->

    </main>

    <!-- フッター -->
    <footer class="footer">
        <p>&copy; 2026 ECサイト All Rights Reserved.</p>
    </footer>

    <!-- 外部JSファイルを読み込む -->
    <script src="js/main.js"></script>

</body>
</html>
